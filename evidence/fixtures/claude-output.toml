[x]
version = "0.1.1"

[commands.hello]
description = "Print a greeting."
run = ["{python}", "-c", "import sys; print('hello', *sys.argv[1:])"]

[commands.greet]
description = "Print greetings followed by the arguments."
run = ["{python}", "-c", "import sys; print('greetings', *sys.argv[1:])"]

[make]

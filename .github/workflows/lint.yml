name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Canonical formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        uses: trycopilotai/lint@3c4322bf89aedcd1c5ce5b8cc37c24be63dd09c1 # v0.1.8
        with:
          mode: read-only
          cwd: .
          docker: "true"
